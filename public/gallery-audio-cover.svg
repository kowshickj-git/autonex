<svg width="640" height="480" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071b31" />
      <stop offset="100%" stop-color="#0c2847" />
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1a5ae0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1a5ae0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="640" height="480" fill="url(#bg)" />
  <rect width="640" height="480" fill="url(#bloom)" />

  <!-- Waveform -->
  <g stroke="#f2760f" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="220" y1="260" x2="220" y2="220" />
    <line x1="245" y1="260" x2="245" y2="180" />
    <line x1="270" y1="260" x2="270" y2="300" />
    <line x1="295" y1="260" x2="295" y2="150" />
    <line x1="320" y1="260" x2="320" y2="330" />
    <line x1="345" y1="260" x2="345" y2="170" />
    <line x1="370" y1="260" x2="370" y2="290" />
    <line x1="395" y1="260" x2="395" y2="200" />
    <line x1="420" y1="260" x2="420" y2="240" />
  </g>

  <text x="320" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15"
        letter-spacing="3" fill="#ffffff" fill-opacity="0.4">AUDIO</text>
</svg>
